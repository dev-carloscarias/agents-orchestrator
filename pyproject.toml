[project]
name = "ai-harness"
version = "1.0.0"
requires-python = ">=3.12"
description = "Multi-agent AI orchestration harness for development tasks"

dependencies = [
    "pydantic>=2.7",
    "rich>=13",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tiktoken>=0.7",     # token counting real
]

[project.scripts]
harness = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "console", "ingestors", "pipeline", "providers", "session"]
